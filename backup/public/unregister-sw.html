<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unregister Service Worker - Academic Ease</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #4a5568;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        #log {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Unregister Service Worker</h1>
    
    <div id="status" class="card">
        Attempting to unregister service worker...
    </div>
    
    <h2>Console Log</h2>
    <div id="log"></div>
    
    <script>
        // Function to log messages to the page
        function log(message) {
            const logElement = document.getElementById('log');
            const logMessage = document.createElement('div');
            logMessage.textContent = new Date().toLocaleTimeString() + ': ' + message;
            logElement.appendChild(logMessage);
            console.log(message);
        }
        
        // Unregister service worker
        if ('serviceWorker' in navigator) {
            log('Service Worker is supported in this browser');
            
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                if (registrations.length === 0) {
                    log('No service workers registered');
                    document.getElementById('status').className = 'card';
                    document.getElementById('status').textContent = 'No service workers registered.';
                    return;
                }
                
                let unregisteredCount = 0;
                
                registrations.forEach(function(registration) {
                    log('Unregistering service worker with scope: ' + registration.scope);
                    
                    registration.unregister()
                        .then(function(success) {
                            if (success) {
                                log('Successfully unregistered service worker with scope: ' + registration.scope);
                                unregisteredCount++;
                                
                                if (unregisteredCount === registrations.length) {
                                    document.getElementById('status').className = 'card success';
                                    document.getElementById('status').textContent = 'All service workers unregistered successfully!';
                                    log('All service workers unregistered');
                                    log('You can now go back to using the application without service worker interference');
                                    
                                    // Add a link to go back to the main application
                                    const backLink = document.createElement('a');
                                    backLink.href = 'index.php';
                                    backLink.className = 'btn btn-primary mt-3 d-block';
                                    backLink.textContent = 'Return to Application';
                                    document.getElementById('status').appendChild(backLink);
                                }
                            } else {
                                log('Failed to unregister service worker with scope: ' + registration.scope);
                                document.getElementById('status').className = 'card error';
                                document.getElementById('status').textContent = 'Failed to unregister some service workers.';
                            }
                        })
                        .catch(function(error) {
                            log('Error unregistering service worker: ' + error);
                            document.getElementById('status').className = 'card error';
                            document.getElementById('status').textContent = 'Error unregistering service worker: ' + error;
                        });
                });
            }).catch(function(error) {
                log('Error getting service worker registrations: ' + error);
                document.getElementById('status').className = 'card error';
                document.getElementById('status').textContent = 'Error getting service worker registrations: ' + error;
            });
        } else {
            log('Service Worker is not supported in this browser');
            document.getElementById('status').className = 'card error';
            document.getElementById('status').textContent = 'Service Worker is not supported in this browser';
        }
    </script>
</body>
</html>
