<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Worker Test - Academic Ease</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #4a5568;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        pre {
            background-color: #f7fafc;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        #log {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Service Worker Test</h1>
    
    <div id="status" class="card">
        Checking service worker registration...
    </div>
    
    <h2>Console Log</h2>
    <div id="log"></div>
    
    <script>
        // Function to log messages to the page
        function log(message) {
            const logElement = document.getElementById('log');
            const logMessage = document.createElement('div');
            logMessage.textContent = new Date().toLocaleTimeString() + ': ' + message;
            logElement.appendChild(logMessage);
            console.log(message);
        }
        
        // Override console.log to also display in our log div
        const originalConsoleLog = console.log;
        console.log = function() {
            originalConsoleLog.apply(console, arguments);
            log(Array.from(arguments).join(' '));
        };
        
        // Override console.error to also display in our log div
        const originalConsoleError = console.error;
        console.error = function() {
            originalConsoleError.apply(console, arguments);
            log('ERROR: ' + Array.from(arguments).join(' '));
        };
        
        // Test service worker registration
        if ('serviceWorker' in navigator) {
            log('Service Worker is supported in this browser');
            
            window.addEventListener('load', function() {
                // Use the correct path to the service worker file
                navigator.serviceWorker.register('./service-worker.js')
                    .then(function(registration) {
                        log('ServiceWorker registration successful with scope: ' + registration.scope);
                        document.getElementById('status').className = 'card success';
                        document.getElementById('status').textContent = 'Service Worker registered successfully!';
                    })
                    .catch(function(err) {
                        log('ServiceWorker registration failed: ' + err);
                        document.getElementById('status').className = 'card error';
                        document.getElementById('status').textContent = 'Service Worker registration failed: ' + err;
                        
                        // Log more detailed error information
                        if (err.name === 'SecurityError') {
                            log('Service worker registration failed due to security restrictions');
                        } else if (err.name === 'TypeError') {
                            log('Service worker URL is invalid or the response is not JavaScript');
                        }
                    });
            });
        } else {
            log('Service Worker is not supported in this browser');
            document.getElementById('status').className = 'card error';
            document.getElementById('status').textContent = 'Service Worker is not supported in this browser';
        }
    </script>
</body>
</html>
