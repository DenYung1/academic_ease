<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Service Worker - Academic Ease</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            padding: 20px;
        }
        .card {
            margin-bottom: 20px;
        }
        #log {
            background-color: #f8f9fa;
            border-radius: 5px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            margin-bottom: 20px;
        }
        .btn-group {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Academic Ease - Service Worker Manager</h1>
        
        <div class="alert alert-info">
            <strong>Service Worker Issue:</strong> The current service worker is causing redirect issues with PHP pages. 
            Use this page to manage your service worker and fix the issue.
        </div>
        
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Service Worker Status</h5>
            </div>
            <div class="card-body">
                <div id="status">Checking service worker status...</div>
                
                <div class="btn-group mt-3">
                    <button id="unregisterBtn" class="btn btn-danger">Unregister Service Worker</button>
                    <button id="registerFixedBtn" class="btn btn-success">Register Fixed Service Worker</button>
                    <button id="disableBtn" class="btn btn-warning">Disable Service Worker</button>
                </div>
                
                <div class="mt-3">
                    <a href="index.php" class="btn btn-primary">Return to Application</a>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Console Log</h5>
            </div>
            <div class="card-body">
                <div id="log"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Function to log messages to the page
        function log(message) {
            const logElement = document.getElementById('log');
            const logMessage = document.createElement('div');
            logMessage.textContent = new Date().toLocaleTimeString() + ': ' + message;
            logElement.appendChild(logMessage);
            logElement.scrollTop = logElement.scrollHeight;
            console.log(message);
        }
        
        // Check service worker status
        function checkServiceWorkerStatus() {
            const statusElement = document.getElementById('status');
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    if (registrations.length === 0) {
                        statusElement.innerHTML = '<div class="alert alert-success">No service workers registered. You should not experience any redirect issues.</div>';
                        log('No service workers registered');
                    } else {
                        let html = '<div class="alert alert-warning">Found ' + registrations.length + ' service worker registration(s):</div><ul>';
                        
                        registrations.forEach(function(registration) {
                            html += '<li>Scope: ' + registration.scope + '</li>';
                            log('Found service worker with scope: ' + registration.scope);
                        });
                        
                        html += '</ul>';
                        statusElement.innerHTML = html;
                    }
                }).catch(function(error) {
                    statusElement.innerHTML = '<div class="alert alert-danger">Error checking service worker status: ' + error + '</div>';
                    log('Error checking service worker: ' + error);
                });
            } else {
                statusElement.innerHTML = '<div class="alert alert-secondary">Service Worker is not supported in this browser</div>';
                log('Service Worker is not supported in this browser');
            }
        }
        
        // Unregister all service workers
        document.getElementById('unregisterBtn').addEventListener('click', function() {
            if ('serviceWorker' in navigator) {
                log('Attempting to unregister all service workers...');
                
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    if (registrations.length === 0) {
                        log('No service workers to unregister');
                        return;
                    }
                    
                    let unregisteredCount = 0;
                    
                    registrations.forEach(function(registration) {
                        log('Unregistering service worker with scope: ' + registration.scope);
                        
                        registration.unregister()
                            .then(function(success) {
                                if (success) {
                                    log('Successfully unregistered service worker');
                                    unregisteredCount++;
                                    
                                    if (unregisteredCount === registrations.length) {
                                        log('All service workers unregistered');
                                        checkServiceWorkerStatus();
                                    }
                                } else {
                                    log('Failed to unregister service worker');
                                }
                            })
                            .catch(function(error) {
                                log('Error unregistering service worker: ' + error);
                            });
                    });
                }).catch(function(error) {
                    log('Error getting service worker registrations: ' + error);
                });
            } else {
                log('Service Worker is not supported in this browser');
            }
        });
        
        // Register the fixed service worker
        document.getElementById('registerFixedBtn').addEventListener('click', function() {
            if ('serviceWorker' in navigator) {
                log('Attempting to register fixed service worker...');
                
                // First unregister any existing service workers
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    const unregisterPromises = registrations.map(registration => {
                        log('Unregistering existing service worker with scope: ' + registration.scope);
                        return registration.unregister();
                    });
                    
                    return Promise.all(unregisterPromises);
                }).then(function() {
                    log('Registering fixed service worker...');
                    
                    // Register the fixed service worker
                    return navigator.serviceWorker.register('./service-worker-fixed.js');
                }).then(function(registration) {
                    log('Fixed service worker registered successfully with scope: ' + registration.scope);
                    checkServiceWorkerStatus();
                }).catch(function(error) {
                    log('Error registering fixed service worker: ' + error);
                });
            } else {
                log('Service Worker is not supported in this browser');
            }
        });
        
        // Disable service worker by adding a no-op service worker
        document.getElementById('disableBtn').addEventListener('click', function() {
            if ('serviceWorker' in navigator) {
                log('Creating and registering a no-op service worker to disable functionality...');
                
                // Create a no-op service worker
                const noopServiceWorker = new Blob([
                    '// No-op service worker\n' +
                    'self.addEventListener("install", function() {\n' +
                    '  self.skipWaiting();\n' +
                    '});\n' +
                    'self.addEventListener("activate", function() {\n' +
                    '  self.clients.claim();\n' +
                    '});\n'
                ], { type: 'application/javascript' });
                
                const noopServiceWorkerURL = URL.createObjectURL(noopServiceWorker);
                
                // First unregister any existing service workers
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    const unregisterPromises = registrations.map(registration => {
                        log('Unregistering existing service worker with scope: ' + registration.scope);
                        return registration.unregister();
                    });
                    
                    return Promise.all(unregisterPromises);
                }).then(function() {
                    log('Registering no-op service worker...');
                    
                    // Register the no-op service worker
                    return navigator.serviceWorker.register(noopServiceWorkerURL);
                }).then(function(registration) {
                    log('No-op service worker registered successfully with scope: ' + registration.scope);
                    log('Service worker functionality is now disabled');
                    checkServiceWorkerStatus();
                }).catch(function(error) {
                    log('Error registering no-op service worker: ' + error);
                });
            } else {
                log('Service Worker is not supported in this browser');
            }
        });
        
        // Check service worker status on page load
        window.addEventListener('load', function() {
            checkServiceWorkerStatus();
        });
    </script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
