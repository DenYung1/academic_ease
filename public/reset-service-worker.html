<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Service Worker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="../assets/img/logo.png" alt="Academic Ease Logo" height="60">
            <h2>Academic Ease</h2>
        </div>
        
        <h3 class="mb-4">Reset Service Worker</h3>
        
        <p>This utility will reset the service worker and clear any cached data to fix navigation issues.</p>
        
        <button id="resetButton" class="btn btn-primary">Reset Service Worker</button>
        
        <div id="status" class="status"></div>
        
        <div class="mt-4">
            <p>After resetting, you can:</p>
            <ul>
                <li><a href="parent-dashboard.php" class="link-primary">Return to Parent Dashboard</a></li>
                <li><a href="link-student.php" class="link-primary">Go to Link Student Page</a></li>
            </ul>
        </div>
    </div>
    
    <script>
        document.getElementById('resetButton').addEventListener('click', function() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Resetting service worker...';
            statusEl.className = 'status';
            statusEl.style.display = 'block';
            
            if ('serviceWorker' in navigator) {
                // Unregister all service workers
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    let unregistered = 0;
                    const total = registrations.length;
                    
                    if (total === 0) {
                        clearCaches();
                        return;
                    }
                    
                    for(let registration of registrations) {
                        registration.unregister().then(function() {
                            console.log('Service worker unregistered');
                            unregistered++;
                            
                            if (unregistered === total) {
                                clearCaches();
                            }
                        });
                    }
                }).catch(function(error) {
                    showError('Error unregistering service workers: ' + error);
                });
            } else {
                showError('Service workers not supported in this browser');
            }
            
            function clearCaches() {
                if ('caches' in window) {
                    caches.keys().then(function(cacheNames) {
                        if (cacheNames.length === 0) {
                            showSuccess('No caches to clear. Service worker reset successfully!');
                            return;
                        }
                        
                        return Promise.all(
                            cacheNames.map(function(cacheName) {
                                return caches.delete(cacheName);
                            })
                        ).then(function() {
                            showSuccess('Service worker reset and caches cleared successfully!');
                        });
                    }).catch(function(error) {
                        showError('Error clearing caches: ' + error);
                    });
                } else {
                    showSuccess('Service worker reset successfully! (Caches API not available)');
                }
            }
            
            function showSuccess(message) {
                statusEl.textContent = message;
                statusEl.className = 'status success';
            }
            
            function showError(message) {
                statusEl.textContent = message;
                statusEl.className = 'status error';
            }
        });
    </script>
</body>
</html>
