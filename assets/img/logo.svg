<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <!-- Logo Icon -->
  <rect x="5" y="10" width="40" height="40" rx="8" fill="url(#gradient)" />
  <text x="15" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">A</text>
  <text x="32" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="rgba(255,255,255,0.8)">E</text>
  
  <!-- Logo Text -->
  <text x="55" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#4285F4">Academic</text>
  <text x="145" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#34A853">Ease</text>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#34A853" />
    </linearGradient>
  </defs>
</svg>
